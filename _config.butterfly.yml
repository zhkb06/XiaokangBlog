# ============================================================
# Butterfly 主题配置（覆盖主题默认值）
# 完整可选项见 themes/butterfly/_config.yml 或 https://butterfly.js.org/
# ============================================================

# ---------- 导航 ----------
nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  大学履历: /experience/ || fas fa-images
  关于我: /about/ || fas fa-user
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags

# ---------- 社交图标 ----------
social:
  fab fa-github: https://github.com/zhkb06 || GitHub || '#24292e'

# ---------- 图标与头像 ----------
favicon: /images/favicon.svg

avatar:
  img: /images/myself.jpg
  effect: false

# ---------- 首页与封面图 ----------
disable_top_img: false
default_top_img: /images/img1.jpg
index_img: /images/background.jpg
archive_img: /images/background.jpg
tag_img: /images/background.jpg
category_img: /images/background.jpg

# 首页头图高度。主题默认 100vh（占满一整屏，首屏看不到文章列表）
# 这里改成 62vh，首屏能看到头图 + 第一篇文章的开头
index_top_img_height: 62vh
# 站点标题离顶部的距离（不填默认 43%）
index_site_info_top: 43%

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /images/img1.jpg
    - /images/img2.jpg
    - /images/img3.jpg
    - /images/img4.jpg

# 首页布局：3 = 卡片式（左图右文）
index_layout: 3
index_post_content:
  method: 3
  length: 300

# ---------- 文章目录 ----------
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false

# ---------- 版权声明 ----------
post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/zhkb06
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# ---------- 页脚 ----------
footer:
  nav:
  owner:
    enable: true
    since: 2024
  copyright:
    enable: true
    version: true
  custom_text: 联系我们：18348742183（微信同号）

# ---------- 侧边栏 ----------
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  card_author:
    enable: true
    description: 移动应用开发在读，折腾 HarmonyOS 与前端。
    button:
      enable: true
      icon: fab fa-github
      text: 关注我
      link: https://github.com/zhkb06
  card_announcement:
    enable: true
    content: 岁岁平，岁岁安，岁岁平安。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 20
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8

# ---------- 主题色（沿用原博客的藏青 + 蓝紫）----------
theme_color:
  enable: true
  main: "#4169E1"
  paginator: "#4169E1"
  button_hover: "#000080"
  text_selection: "#000080"
  link_color: "#4169E1"
  meta_color: "#6b7280"
  hr_color: "#B5D4F4"
  code_foreground: "#F47466"
  code_background: "rgba(27, 31, 35, .05)"
  toc_color: "#4169E1"
  blockquote_padding_color: "#4169E1"
  blockquote_background_color: "#E6F1FB"
  scrollbar_color: "#4169E1"
  meta_theme_color_light: "#000080"
  meta_theme_color_dark: "#0d0d0d"

# ---------- 显示模式 ----------
display_mode: light
darkmode:
  enable: true
  button: true
  autoChangeMode: 2

# ---------- 搜索 ----------
search:
  use: local_search
  placeholder: 搜索文章
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false

# ---------- 图片灯箱 ----------
fancybox:
  enable: true

# ---------- 注入自定义样式 ----------
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:

# ---------- CDN ----------
CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true
